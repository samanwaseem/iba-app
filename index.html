const SP=()=>{$('#sp').innerHTML=`<button class=spb data-a=sp>Study</button>`+(S.sp?`<div class=spp><b>Usability study</b><small>${T.cur?'Active: '+T.cur[1]:'Pick a task, then press Start. Time, taps and errors are logged.'}</small>${TN.map((t,i)=>`<div class="row sp"><span>${i+1}. ${t[1]}</span><button class=ch data-a=start data-v=${i}>Start</button></div>`).join('')}${T.cur?'<button class=ch data-a=skip>Give up task</button>':''}${T.res.length?`<table class=tb><tr><th>Task</th><th>s</th><th>Taps</th><th>Err</th><th></th></tr>${T.res.map(r=>`<tr><td>${r[0].slice(0,18)}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4][0]}</td></tr>`).join('')}</table><button class=ch data-a=csv>Copy CSV</button>`:''}<small>Test codes: 123456 works; 000000 shows the not-enrolled error.</small></div>`:'')};
const done=k=>{if(T.cur&&T.cur[0]==k){T.res.push([T.cur[1],((Date.now()-T.t0)/1000).toFixed(1),T.taps,T.err,'Success']);T.cur=null;S.ts='Study task complete'}};
const val=r=>{E={};for(const k in r){const[q,re,m]=r[k],x=(F[k]||'')+'';if(!x.trim())E[k]=q;else if(re&&!re.test(x))E[k]=m}if(Object.keys(E).length){T.err++;return 0}return 1};
const A={
tab:v=>{if(S.done){F={sem:F.sem,yr:F.yr};S.vs=[];S.done=0}S.t=v;S.h=[];S.v=v;S.f='All';E={};S.m=null},go:v=>{S.h.push(S.v);S.v=v;S.f='All';E={};S.edit=null;if(/ok$/.test(v))S.done=1},yes:()=>{S.m=null;const f=CB;CB=null;f&&f()},edit:v=>{const x=IN.find(y=>y.id==v);F={sem:F.sem,yr:F.yr,ty:x.ty,og:x.o,ro:x.ro,st:x.st,en:x.en,d:x.doc};A.go('cd1');S.edit=v},back:()=>{S.v=S.h.pop()||S.t;E={}},
in:()=>{if(val({erp:['Enter your ERP ID'],pw:['Enter your password']})){S.v='att';S.t='att'}},
out:()=>ask('Sign out?','You will need to sign in again.','Sign out',()=>{S.v='login';S.h=[];S.t='att';F={sem:F.sem,yr:F.yr}}),
day:v=>S.day=+v,dir:()=>{S.dir=1-S.dir;S.rem=0},rem:()=>{S.rem=1-S.rem;S.ts=S.rem?'Reminder set for 5 min before':'Reminder removed'},
m:v=>{S.m=v;S.code=''},x:()=>S.m=null,tor:()=>S.tor=1-S.tor,sim:()=>{S.m='ok';S.code='QR-'+Math.floor(1000+Math.random()*9000);S.mk=1;CO.HCI[4]++;CO.HCI[5]++;done('att')},
k:v=>{if(v=='del')S.code=S.code.slice(0,-1);else if(S.code.length<6)S.code+=v},
cf:()=>{if(S.code=='000000'){S.m='no';T.err++}else{S.m='ok';if(!S.mk){S.mk=1;CO.HCI[4]++;CO.HCI[5]++}done('att')}},
seg:v=>S.seg=v,flt:v=>S.f=v,rt:v=>{S.rt=v;delete F.pk},tog:v=>S.tg[v]=S.tg[v]?0:1,det:v=>{S.sel=v;A.go('cdet')},
file:v=>F[v]=F[v]?'':FN[v]||'File.pdf',toast:v=>{S.ts=v},sp:()=>S.sp=1-S.sp,
start:v=>{T.cur=TN[v];T.t0=Date.now();T.taps=0;T.err=0;S.sp=0},skip:()=>{T.res.push([T.cur[1],'—',T.taps,T.err,'Abandoned']);T.cur=null},
csv:()=>{const c='task,seconds,taps,errors,result\n'+T.res.map(r=>r.join(',')).join('\n');try{navigator.clipboard.writeText(c);S.ts='CSV copied'}catch(e){S.ts='Copy failed'}},
sub:v=>{
if(v=='b1'){if(val({sid:['Enter your student ID'],bs:['Select a semester']}))A.go('b2')}
else if(v=='b4'){if(val({pk:['Select a pickup stop']}))ask('Sign up for Point '+S.rt+'?','Pickup: '+F.pk+' · '+F.bs+'.','Sign up',()=>{A.go('bok');done('bus')})}
else if(v=='addv'||v=='g1'){if(val({vn:['Enter the visitor’s full name'],cn:['Enter the CNIC',/^\d{5}-\d{7}-\d$/,'Use format 00000-0000000-0'],vp:['Enter a phone number',/^03\d{2} ?\d{7}$/,'Use format 03XX XXXXXXX']})){S.vs.push(F.vn);if(v=='addv'){['vn','cn','vp','pic'].forEach(k=>delete F[k]);S.ts='Visitor added. Add the next one.'}else A.go('g2')}}
else if(v=='g2'){if(val({vd:['Select a visit date'],vc:['Select a campus'],vr:['Describe the purpose of the visit']}))ask('Submit gate pass request?','This is a request, not an approved pass. '+S.vs.length+' visitor(s) on '+F.vd+'.','Submit',()=>{A.go('gok');done('gate')})}
else if(v=='cd1'){if(val({ty:['Choose a type'],og:['Enter the organization'],ro:['Enter your role'],st:['Pick a start date'],en:['Pick an end date'],d:['Attach your offer letter']})){if(F.en<F.st){E.en='End date must be after start date';return}const ed=S.edit;ask(ed?'Save your changes?':'Submit internship documents?',ed?'Your submission will be updated. You can edit again until '+fd(IN.find(x=>x.id==ed).dl)+'.':'CDC will review them. You can edit until '+fd(DL)+'.',ed?'Save changes':'Submit',()=>{if(ed){Object.assign(IN.find(x=>x.id==ed),{o:F.og,ty:F.ty,ro:F.ro,st:F.st,en:F.en,doc:F.d});S.edit=null;F={sem:F.sem,yr:F.yr};S.v=S.h.pop()||'ch';S.ts='Changes saved'}else{IN.unshift({id:''+(17025+IN.length),o:F.og,ty:F.ty,ro:F.ro,st:F.st,en:F.en,doc:F.d,dl:DL,s:'Pending',d:'23/10/26'});A.go('cdok')}})}}
else if(v=='cl1'){const r={pu:['Choose a purpose'],lo:['Enter the recipient'],pr:['Enter the program or opportunity'],by:['Pick a deadline'],dm:['Choose a delivery method']};if(F.dm=='Email to recipient')r.em=['Enter the recipient email',/^\S+@\S+\.\S+$/,'Enter a valid email address'];if(val(r))A.go('clr')}
else if(v=='clr')ask('Send request to CDC?','Letter for '+F.lo+', required by '+F.by+'.','Send request',()=>{LT.unshift({id:'RCL-26'+(43+LT.length),o:F.lo,p:F.pu,s:'Pending',d:'23/10/26'});A.go('clok');done('letter')})}
};
document.addEventListener('click',e=>{if(T.cur&&e.target.closest('#app'))T.taps++;const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;A[a](v);if(a=='go'&&v=='adm')done('admit');R()});
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;let v=e.target.value;if(k=='cn'){v=v.replace(/\D/g,'').slice(0,13).replace(/^(\d{5})(\d{1,7})/,'$1-$2').replace(/^(\d{5}-\d{7})(\d)/,'$1-$2');e.target.value=v}F[k]=v;delete E[k];e.target.closest('.f')?.classList.remove('bad')});
document.addEventListener('change',e=>{const k=e.target.dataset.k;if(k&&e.target.tagName=='SELECT'){F[k]=e.target.value;delete E[k];R()}});
R();
</script></body></html>
