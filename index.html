<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>IBA Student App – HCI prototype</title><style>
:root{--m:#6b0a2b;--m2:#8e1233;--t:#1f1a1d;--g:#6d6569;--b:#e8e4e7;--bg:#f6f5f7;--p:#f6e6ec;--ok:#17803d;--w:#b45309;--sb:#e9e6ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--sb:#141114}}
:root[data-theme=dark]{--sb:#141114}
*{box-sizing:border-box;margin:0;font:inherit}html,body{height:100%}
body{font:14px/1.4 Inter,system-ui,sans-serif;background:var(--sb);color:var(--t);display:grid;place-items:center}
#app{position:relative;width:390px;height:844px;max-width:100vw;max-height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;border-radius:36px;box-shadow:0 20px 60px #0005}
@media(max-width:500px){:root{padding:0}html,body{height:100dvh;background:var(--bg);display:block}#app{position:fixed;left:0;top:0;right:0;bottom:0;width:100vw;height:100dvh;max-width:none;max-height:none;border-radius:0;box-shadow:none}#app .sb,#app .hi{display:none}#app .bn{height:calc(140px + env(safe-area-inset-top,0px));padding-top:calc(14px + env(safe-area-inset-top,0px))}#app .bn.pf{height:calc(200px + env(safe-area-inset-top,0px))}#app .ct{padding-top:calc(66px + env(safe-area-inset-top,0px))}#app .ct.pf{padding-top:calc(210px + env(safe-area-inset-top,0px))}#app .nav{padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}#app .lg .lgo{top:calc(44px + env(safe-area-inset-top,0px))}#app .lg form{bottom:calc(150px + env(safe-area-inset-bottom,0px))}#app .lg .cap{bottom:calc(24px + env(safe-area-inset-bottom,0px))}#app .lg{min-height:100%}input,select,textarea{font-size:16px}}
.sb{flex:none;height:44px;background:#6b0a2b;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 26px;position:relative;z-index:3;font-weight:600;font-size:14px}.sb span{display:flex;gap:6px;align-items:center}.sb i{position:absolute;left:50%;top:8px;width:120px;height:28px;margin-left:-60px;background:#000;border-radius:16px}
.lg .sb{background:none;position:absolute;left:0;right:0;top:0}
small{display:block;color:var(--g);font-size:12px}h2{font-size:20px;font-weight:700}
.scr{flex:1;overflow:auto;overscroll-behavior:contain}.wr{position:relative;min-height:100%}
.bn{position:absolute;left:0;right:0;top:0;height:140px;background:linear-gradient(160deg,#6b0a2b,#8e1233);border-radius:0 0 30px 30px;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:flex-start}.bn.pf{height:200px;flex-direction:column;align-items:center;text-align:center}.bn small{color:#f3d3dc}
.bn h1{font-size:19px;font-weight:400;margin-top:6px}.av{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--m);display:grid;place-items:center;font-weight:700}
.ct{position:relative;padding:66px 16px 20px}.ct.pf{padding-top:210px}
.hi{flex:none;height:20px;background:#fff;display:grid;place-items:center}.hi:after{content:"";width:130px;height:5px;border-radius:3px;background:#1f1a1d}
.c{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 3px #0001;margin-bottom:12px}
.btn{width:100%;border:0;border-radius:12px;background:var(--m);color:#fff;padding:13px;font-weight:600;cursor:pointer;display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:8px}
.btn.o{background:#fff;color:var(--m);border:1.5px solid var(--m)}.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.li{width:100%;display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--b);background:none;text-align:left;cursor:pointer;color:inherit}.li:last-child{border:0}
.ic{width:36px;height:36px;border-radius:10px;background:var(--p);color:var(--m);display:grid;place-items:center;flex:none;font-weight:700}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav{display:flex;background:#fff;border-top:1px solid var(--b);padding:8px 4px 0;flex:none}
.nav button{flex:1;border:0;background:none;color:var(--g);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav span{padding:4px 16px;border-radius:14px;display:flex}.nav .on{color:var(--m);font-weight:700}.nav .on span{background:var(--p)}
.ch{padding:6px 14px;border-radius:99px;border:1px solid var(--b);background:#fff;cursor:pointer;color:var(--t);font-size:13px}.ch.on{background:var(--m);color:#fff;border-color:var(--m)}
.chs{display:flex;gap:8px;margin-bottom:12px;overflow:auto}
.f{margin-bottom:12px}.f label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--b);border-radius:10px;background:#fff;font-size:14px;color:var(--t)}
input[readonly]{background:var(--bg)}.bad input,.bad select,.bad textarea,.bad .up2{flex-direction:column;align-items:center;border-color:#c0262d}
.er{color:#c0262d;font-size:12px;margin-top:4px;display:none}.bad .er{display:block}
.up2{flex-direction:column;align-items:center;width:100%;border:1.5px dashed var(--m);border-radius:10px;background:#fff;color:var(--m);padding:14px;display:flex;gap:8px;justify-content:center;cursor:pointer}
.bd{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--p);color:var(--m);font-weight:600;white-space:nowrap}.bd.ok{background:#e3f4e9;color:var(--ok)}
.bk{border:0;background:none;color:var(--m);display:flex;align-items:center;font-weight:600;cursor:pointer;margin-bottom:4px;padding:0}
.sec{display:block;margin:6px 0 8px}.nt{font-size:12px;color:var(--g);margin-top:8px;display:flex;gap:6px;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bx{border:1px solid var(--b);border-radius:12px;background:#fff;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--m);font-weight:600}
.days{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.dy{border:1px solid var(--b);background:#fff;border-radius:12px;padding:6px 10px;cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;color:var(--t)}.dy.on{background:var(--m);color:#fff}
.rg{border:3px solid var(--ok);color:var(--ok);border-radius:50%;width:46px;height:46px;display:grid;place-items:center;font-weight:700;font-size:12px}.rg.w{border-color:var(--w);color:var(--w)}
.big{font-size:44px;font-weight:700;color:var(--m);line-height:1}.big small{display:inline;font-size:16px}
.ib{border:1px solid var(--b);background:#fff;color:var(--m);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.op{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid var(--b);border-radius:12px;background:#fff;margin-bottom:8px;cursor:pointer;text-align:left;color:var(--t)}.op.on{border-color:var(--m);background:var(--p)}
.rd{width:18px;height:18px;border:2px solid var(--g);border-radius:50%;flex:none}.op.on .rd{border:5px solid var(--m)}
.rt{position:relative;padding-left:24px;border-left:3px solid var(--m);margin:10px 0 4px 6px}.rt div{position:relative;padding:7px 0}
.rt div:before{content:"";position:absolute;left:-32px;top:11px;width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--m)}
.rt div:not(:last-child):after{content:"▾";position:absolute;left:-27px;bottom:-8px;color:var(--m);font-size:13px}.rt .sel{font-weight:700;color:var(--m)}.rt .sel:before{background:var(--m)}
.tb{width:100%;border-collapse:collapse}.tb td,.tb th{padding:6px 4px;border-bottom:1px solid var(--b);text-align:left;font-size:13px}
.tg{width:44px;height:26px;border-radius:99px;background:#cfc8cc;border:0;position:relative;cursor:pointer;flex:none}.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--m)}.tg.on:after{left:21px}
.mo{position:absolute;inset:0;background:#0006;backdrop-filter:blur(4px);display:flex;align-items:center;padding:16px;z-index:5}.md{background:#fff;border-radius:20px;padding:16px;width:100%;max-height:100%;overflow:auto}
.ctr{text-align:center}.ckc{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:8px auto}.ckc.x{background:#a3162a}.ckc svg{width:32px;height:32px;stroke-width:3}
.cb{display:flex;gap:6px;margin:10px 0}.cb span{flex:1;height:44px;border:1px solid var(--b);border-radius:10px;display:grid;place-items:center;font-size:20px;font-weight:700}.cb .cur{border:2px solid var(--m)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.kp button{padding:11px;border:0;border-radius:10px;background:var(--bg);font-size:20px;cursor:pointer}
.sc{height:190px;background:#262226;border-radius:14px;position:relative;overflow:hidden;margin:10px 0}.sc.t{background:#4a4448}.sc i{position:absolute;left:10%;right:10%;height:2px;background:#e86a92;animation:sw 2s infinite alternate}@keyframes sw{from{top:15%}to{top:85%}}
@media(prefers-reduced-motion:reduce){.sc i{animation:none;top:50%}}
.wn{display:flex;gap:8px;align-items:center;background:#fdf1dc;color:#8a5a00;border-radius:10px;padding:8px 10px;font-size:12px;margin-top:10px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tags i{font-style:normal;font-size:10px;background:#f6e6ec;color:var(--m);padding:3px 7px;border-radius:5px;font-weight:600}.dy{min-width:52px}.dy small{color:inherit}.pr{display:flex;gap:6px;margin:0 0 6px}.pr i{flex:1;height:3px;background:var(--b);border-radius:2px}.pr i.on{background:var(--m)}.tile{border:1px solid var(--b);background:#fff;border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:grid;gap:10px;color:var(--t)}.sch{border:1px dashed var(--b);border-radius:10px;padding:8px 12px;background:repeating-linear-gradient(0deg,#fff 0 18px,#faf7f8 18px 19px)}.ts{position:absolute;left:16px;right:16px;bottom:84px;background:#1f1a1d;color:#fff;padding:12px 14px;border-radius:12px;z-index:9}

const NAV=[['att','Attendance','att'],['tr','Transport','bus'],['ex','Exams','exam'],['car','Career','career'],['pro','Profile','user']];

const R=()=>{const old=$('.scr'),y=old?old.scrollTop:0,dv=$('[data-sc]'),dl=dv?dv.scrollLeft:S.dl;if(dv)S.dl=dv.scrollLeft;const same=R.lv==S.v;R.lv=S.v;const v=V[S.v]();const pf=S.v=='pro',g=S.v=='att'?'Welcome back, <b>Hadeeqa</b>!':pf?'':'Hadeeqa al Islam';
$('#app').innerHTML=S.v=='login'?SB+v:`${SB}<div class=scr><div class=wr><div class="bn ${pf?'pf':''}">${pf?`<div class=av style="width:72px;height:72px;font-size:24px;margin-top:6px">HI</div><h1 style=font-weight:700;font-size:21px>Hadeeqa al Islam</h1><small>BS Computer Science • Semester 7</small><small>ID: ${U.erp}</small>`:`<h1>${g}</h1><div class=av>HI</div>`}</div><div class="ct ${pf?'pf':''}">${v}</div></div></div><nav class=nav>${NAV.map(n=>`<button class="${S.t==n[0]?'on':''}" data-a=tab data-v=${n[0]} ${S.t==n[0]?'aria-current=page':''}><span>${I(n[2])}</span>${n[1]}</button>`).join('')}</nav><div class=hi></div>`;
const sc=$('.scr');if(sc&&same)sc.scrollTop=y;const d2=$('[data-sc]');if(d2){if(dl!=null)d2.scrollLeft=dl;else{const o=d2.querySelector('.on');d2.scrollLeft=o.offsetLeft-d2.offsetLeft-16;S.dl=d2.scrollLeft}}
$('#app').insertAdjacentHTML('beforeend',(S.m?modal():'')+(S.ts?`<div class=ts role=status>${S.ts}</div>`:''));SP();if(S.ts){clearTimeout(R.t);R.t=setTimeout(()=>{S.ts='';R()},2200)}};
const SP=()=>{$('#sp').innerHTML=`<button class=spb data-a=sp>Study</button>`+(S.sp?`<div class=spp><b>Usability study</b><small>${T.cur?'Active: '+T.cur[1]:'Pick a task, then press Start. Time, taps and errors are logged.'}</small>${TN.map((t,i)=>`<div class="row sp"><span>${i+1}. ${t[1]}</span><button class=ch data-a=start data-v=${i}>Start</button></div>`).join('')}${T.cur?'<button class=ch data-a=skip>Give up task</button>':''}${T.res.length?`<table class=tb><tr><th>Task</th><th>s</th><th>Taps</th><th>Err</th><th></th></tr>${T.res.map(r=>`<tr><td>${r[0].slice(0,18)}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4][0]}</td></tr>`).join('')}</table><button class=ch data-a=csv>Copy CSV</button>`:''}<small>Test codes: 123456 works; 000000 shows the not-enrolled error.</small></div>`:'')};
const done=k=>{if(T.cur&&T.cur[0]==k){T.res.push([T.cur[1],((Date.now()-T.t0)/1000).toFixed(1),T.taps,T.err,'Success']);T.cur=null;S.ts='Study task complete'}};
const val=r=>{E={};for(const k in r){const[q,re,m]=r[k],x=(F[k]||'')+'';if(!x.trim())E[k]=q;else if(re&&!re.test(x))E[k]=m}if(Object.keys(E).length){T.err++;return 0}return 1};
const A={
tab:v=>{if(S.done){F={sem:F.sem,yr:F.yr};S.vs=[];S.done=0}S.t=v;S.h=[];S.v=v;S.f='All';E={};S.m=null},go:v=>{S.h.push(S.v);S.v=v;S.f='All';E={};if(/ok$/.test(v))S.done=1},back:()=>{S.v=S.h.pop()||S.t;E={}},
in:()=>{if(val({erp:['Enter your ERP ID'],pw:['Enter your password']})){S.v='att';S.t='att'}},
out:()=>{S.v='login';S.h=[];S.t='att';F={sem:F.sem,yr:F.yr}},
day:v=>S.day=+v,dir:()=>{S.dir=1-S.dir;S.rem=0},rem:()=>{S.rem=1-S.rem;S.ts=S.rem?'Reminder set for 5 min before':'Reminder removed'},
m:v=>{S.m=v;S.code=''},x:()=>S.m=null,tor:()=>S.tor=1-S.tor,sim:()=>{S.m='ok';S.code='QR-'+Math.floor(1000+Math.random()*9000);S.mk=1;CO.HCI[4]++;CO.HCI[5]++;done('att')},

else if(v=='clr'){LT.unshift({id:'RCL-26'+(43+LT.length),o:F.lo,p:F.pu,s:'Pending',d:'23/10/26'});A.go('clok');done('letter')}}
};
