const searchRows=(q='')=>{const z=q.trim().toLowerCase();const taskHits=[...REM].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).filter(r=>!z||[r.title,r.type,r.course||'',r.date,r.time,r.source||''].join(' ').toLowerCase().includes(z)).slice(0,10).map(r=>`<button class="search-result ${r.type.toLowerCase()}" data-a=jumpRem data-v=${r.id}><i class=sr-dot></i><span class=sr-copy><b>${escHTML(r.title)}</b><small>${escHTML(r.type)}${r.course?' · '+escHTML(r.course):''} · ${prettyDate(r.date)} · ${escHTML(r.time)}</small></span>${I('chev')}</button>`);const appHits=APP_SEARCH.filter(r=>!z||[r.title,r.section,r.detail,r.keywords].join(' ').toLowerCase().includes(z)).slice(0,10).map(r=>`<button class="search-result app-result" data-a=searchNavigate data-v=${r.target}><i class=sr-dot></i><span class=sr-copy><b>${escHTML(r.title)}</b><small>${escHTML(r.section)} · ${escHTML(r.detail)}</small></span>${I('chev')}</button>`);const courseHits=Object.entries(CO).filter(([k,c])=>!z||[k,...c].join(' ').toLowerCase().includes(z)).map(([k,c])=>`<button class="search-result app-result" data-a=searchNavigate data-v=att><i class=sr-dot></i><span class=sr-copy><b>${escHTML(c[0])}</b><small>Course · ${escHTML(c[1])} · ${escHTML(c[2])}</small></span>${I('chev')}</button>`);const all=[...taskHits,...appHits,...courseHits].slice(0,18);return all.length?all.join(''):'<div class=search-empty>No matches in the app. Try a feature, course, service, deadline or keyword.</div>'};
const searchPanel=()=>`<section class=search-screen aria-label=Search><div class=search-screen-head><h2>Search</h2><button class=search-close data-a=searchClose>Done</button></div><label class=search-field><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg><input id=appSearchInput type=search autocomplete=off placeholder="Search anything in the app…" value="${escHTML(S.searchQuery)}" aria-label="Search all app content"></label><div class=search-section-title>Explore the app</div><div class=search-presets><button data-a=searchPreset data-v=Attendance>Attendance</button><button data-a=searchPreset data-v=Transport>Transport</button><button data-a=searchPreset data-v=Exams>Exams</button><button data-a=searchPreset data-v=Career>Career</button><button data-a=searchPreset data-v=Profile>Profile & settings</button><button data-a=searchPreset data-v=Assignment>Assignments</button><button data-a=searchPreset data-v=Quiz>Quizzes</button><button data-a=searchPreset data-v=Upcoming>Upcoming</button></div><div class=search-section-title>${S.searchQuery?'Matching results':'Suggested tasks'}</div><div id=searchResults>${searchRows(S.searchQuery)}</div></section>`;

if(v=='b1'){if(val({sid:['Enter your student ID'],bs:['Select a semester']}))A.go('b2')}

else if(v=='clr')ask('Send request to CDC?','Letter for '+F.lo+', required by '+F.by+'.','Send request',()=>{LT.unshift({id:'RCL-26'+(43+LT.length),o:F.lo,p:F.pu,s:'Pending',d:'23/10/26'});A.go('clok');done('letter')})}
};
