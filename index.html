lms:()=>{REM=REM.filter(r=>r.source!=='LMS demo');const base=new Date();base.setHours(0,0,0,0);const courses=['Human Computer Interaction','Reinforcement Learning','Cloud Computing','Intelligent Data Architectures','Final Year Project'];const kinds=['Assignment','Quiz','Project'];let made=[];for(let i=0;i<18;i++){const d=new Date(base);d.setDate(base.getDate()+((i*2+1)%24)+1);const type=kinds[i%3],date=dateISO(d),time=type==='Assignment'?'23:55':type==='Quiz'?['10:30','14:00','19:00'][i%3]:'23:55';made.push({id:REMID++,title:`${courses[i%courses.length]} — ${type} ${Math.floor(i/3)+1}`,date,time,type,source:'LMS demo',hi:false})}REM.push(...made);S.calDay=made[0].date;S.calMonth=S.calDay.slice(0,7);S.ts=`${made.length} deadlines imported`},

go:v=>{if(v==='custom')S.tip=0;S.h.push(S.v);S.v=v;S.f='All';E={};S.edit=null;if(/ok$/.test(v))S.done=1},yes:()=>{S.m=null;const f=CB;CB=null;f&&f()},edit:v=>{const x=IN.find(y=>y.id==v);F={sem:F.sem,yr:F.yr,ty:x.ty,og:x.o,ro:x.ro,st:x.st,en:x.en,d:x.doc};A.go('cd1');S.edit=v},back:()=>{S.v=S.h.pop()||S.t;E={}},

file:v=>F[v]=F[v]?'':FN[v]||'File.pdf',toast:v=>{S.ts=v},sp:()=>S.sp=1-S.sp,

sub:v=>{
if(v=='b1'){if(val({sid:['Enter your student ID'],bs:['Select a semester']}))A.go('b2')}
else if(v=='b4'){if(val({pk:['Select a pickup stop']}))ask('Sign up for Point '+S.rt+'?','Pickup: '+F.pk+' · '+F.bs+'.','Sign up',()=>{S.bk={id:'PB-'+(26100+Math.floor(Math.random()*900)),rt:S.rt,pk:F.pk,bs:F.bs,sid:F.sid};A.go('bok');done('bus')})}
else if(v=='addv'||v=='g1'){if(val({vn:['Enter the visitor’s full name'],cn:['Enter the CNIC',/^\d{5}-\d{7}-\d$/,'Use format 00000-0000000-0'],vp:['Enter a phone number',/^03\d{2} ?\d{7}$/,'Use format 03XX XXXXXXX']})){S.vs.push(F.vn);if(v=='addv'){['vn','cn','vp','pic'].forEach(k=>delete F[k]);S.ts='Visitor added. Add the next one.'}else A.go('g2')}}
else if(v=='g2'){if(val({vd:['Select a visit date'],vc:['Select a campus'],vr:['Describe the purpose of the visit']}))ask('Submit gate pass request?',S.vs.length+(S.vs.length>1?' visitors':' visitor')+' · '+fd(F.vd)+'.','Submit',()=>{GP.unshift({id:'GP-'+(4101+GP.length),v:[...S.vs],date:F.vd,campus:F.vc,pr:F.vr,s:'Pending'});A.go('gok');done('gate')})}
else if(v=='cd1'){if(val({ty:['Choose a type'],og:['Enter the organization'],ro:['Enter your role'],st:['Pick a start date'],en:['Pick an end date'],d:['Attach your offer letter']})){if(F.en<F.st){E.en='End date must be after start date';return}const ed=S.edit;ask(ed?'Save your changes?':'Submit internship documents?',ed?'Your submission will be updated. You can edit again until '+fd(IN.find(x=>x.id==ed).dl)+'.':'CDC will review them. You can edit until '+fd(DL)+'.',ed?'Save changes':'Submit',()=>{if(ed){Object.assign(IN.find(x=>x.id==ed),{o:F.og,ty:F.ty,ro:F.ro,st:F.st,en:F.en,doc:F.d});S.edit=null;F={sem:F.sem,yr:F.yr};S.v=S.h.pop()||'ch';S.ts='Changes saved'}else{IN.unshift({id:''+(17025+IN.length),o:F.og,ty:F.ty,ro:F.ro,st:F.st,en:F.en,doc:F.d,dl:DL,s:'Pending',d:'23 Oct 2026'});A.go('cdok')}})}}
else if(v=='cl1'){const r={pu:['Choose a purpose'],lo:['Enter the recipient'],pr:['Enter the program or opportunity'],by:['Pick a deadline'],dm:['Choose a delivery method']};if(F.dm=='Email to recipient')r.em=['Enter the recipient email',/^\S+@\S+\.\S+$/,'Enter a valid email address'];if(val(r))A.go('clr')}
else if(v=='clr')ask('Send request to CDC?','Letter for '+F.lo+', required by '+F.by+'.','Send request',()=>{LT.unshift({id:'RCL-26'+(43+LT.length),o:F.lo,p:F.pu,s:'Pending',d:'23 Oct 2026'});A.go('clok');done('letter')})}
};
document.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('mo')){S.m=null;R();return}if(T.cur&&e.target.closest('#app'))T.taps++;const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;if(typeof A[a]!=='function')return;A[a](v);if(a==='go'&&v==='adm')done('admit');R()});

document.addEventListener('keydown',e=>{if(S.m=='code'){if(/^\d$/.test(e.key)){A.k(e.key);R();return}if(e.key=='Backspace'){A.k('del');R();return}if(e.key=='Enter'&&S.code.length==6){A.cf();R();return}}if(e.key=='Escape'&&S.searchOpen){S.searchOpen=0;R()}else if(e.key=='Escape'&&S.fid==1){A.fidx();R()}else if(e.key=='Escape'&&S.m){S.m=null;R()}});

document.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;let v=e.target.value;if(k==='pid'){T.pid=v.toUpperCase().replace(/[^A-Z0-9-]/g,'');e.target.value=T.pid;return}if(k==='taskQuery'){S.taskQuery=v;const pos=e.target.selectionStart;R();const n=$('[data-k=taskQuery]');if(n){n.focus();n.setSelectionRange(pos,pos)}return}if(MK[k]){v=MK[k](v);if(e.target.value!==v)e.target.value=v}F[k]=v;delete E[k];e.target.closest('.f')?.classList.remove('bad')});

/* ---------- alarm, shuttle reminder, tickets, ID card, marks, task filters ---------- */
let GP=[],AC=null,ALT=null;
const audioInit=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}};
const alarmOn=()=>{alarmOff();const t=()=>{try{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.18)}catch(e){}if(navigator.vibrate)navigator.vibrate(200)};t();ALT=setInterval(t,600)};
const alarmOff=()=>{clearInterval(ALT);ALT=null;if(navigator.vibrate)navigator.vibrate(0)};
const remTotal=()=>NX[S.dir][0]-5;
const remElapsed=()=>{let e=(Date.now()-S.r0)/60000;if(S.rs0){const k=Math.min(1,(Date.now()-S.rs0)/4000);e=Math.max(e,S.rb+(remTotal()-S.rb)*k)}return e};
const remText=()=>{const l=remTotal()-remElapsed();return l>=1?`Alert in ${Math.ceil(l)} min`:`Alert in ${Math.max(1,Math.ceil(l*60))} s`};
const remBtn=()=>{const sim='<button class=mk-alt data-a=simAlarm>Simulate alarm</button>';if(!S.rem)return btn(I('bell')+'Remind me 5 min before','rem')+sim;const p=Math.min(1,remElapsed()/remTotal());return `<button class="btn o" data-a=rem style="position:relative;overflow:hidden;justify-content:space-between"><span id=rpf style="position:absolute;left:0;top:0;bottom:0;width:${p*100}%;background:var(--p)"></span><span style="position:relative;display:flex;gap:8px;align-items:center">${I('bell')}<span id=rpt>${remText()}</span></span><span style="position:relative;font-size:12px">Tap to cancel</span></button>${sim}`};
setInterval(()=>{if(!S.rem)return;const p=Math.min(1,remElapsed()/remTotal());if(p>=1){S.rem=0;S.rs0=0;S.m='alarm';audioInit();alarmOn();R();return}const f=$('#rpf');if(f){f.style.width=p*100+'%';$('#rpt').textContent=remText()}},250);

const bkTicket=()=>S.bk?`<div class=c style="border:1.5px dashed var(--m)"><div class="row sp"><b class=ttl>Point bus ticket</b><span class="bd ok">Active</span></div><div style="margin:10px 0 2px;font-size:28px;font-weight:700;color:var(--m)">Point ${S.bk.rt}</div><small>${RT[S.bk.rt].fr} → ${RT[S.bk.rt].to} · ${RT[S.bk.rt].v}</small>${rows([['Ticket no.',S.bk.id],['Pickup',S.bk.pk],['Semester',S.bk.bs],['Student ID',S.bk.sid]])}<button class="btn o" style="margin-top:10px" data-a=cancelBk>Cancel booking</button></div>`:'';

const qrSvg=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;let o='';for(let y=0;y<11;y++)for(let x=0;x<11;x++){h=(h*1103515245+12345)>>>0;if((h>>>16)&1)o+=`<rect x=${x} y=${y} width=1 height=1 />`}return `<svg viewBox="0 0 11 11" width=130 height=130 fill="#1f1a1d" style="background:#fff;padding:6px;border:1px solid var(--b);border-radius:10px">${o}</svg>`};
const gpCard=g=>g.s=='Approved'?`<div class=c style="border:1.5px solid var(--ok)"><div class="row sp"><b class=ttl>Gate pass</b><span class="bd ok">Approved</span></div><div class=ctr style="margin:12px 0">${qrSvg(g.id)}<small>Show this at the gate</small></div>${rows([['Pass no.',g.id],['Visitors',g.v.join(', ')],['Valid on',fd(g.date)],['Campus',g.campus]])}</div>`:`<div class=c style="border:1.5px dashed var(--m)"><div class="row sp"><b class=ttl>Gate pass request</b><span class=bd>Pending review</span></div>${rows([['Ticket no.',g.id],['Visitors',g.v.join(', ')],['Date',fd(g.date)],['Campus',g.campus],['Purpose',g.pr]])}<small style="margin-top:8px">Your gate pass appears here once security approves.</small><button class=btn style="margin-top:10px" data-a=approveGp data-v=${g.id}>Simulate approval (prototype)</button></div>`;

const idCard=()=>`<div class=c style="padding:0;overflow:hidden;border-radius:18px"><div class="row sp" style="background:linear-gradient(120deg,#6b0a2b,#a8173f);color:#fff;padding:12px 14px"><b>IBA Karachi</b><small style="color:#f3d3dc">Student ID card</small></div><div class=row style="padding:14px;align-items:flex-start;gap:14px"><div class=av style="width:72px;height:88px;border-radius:12px;background:var(--p);font-size:24px;flex:none">HI</div><div style="flex:1;min-width:0"><b style="font-size:16px">Hadeeqa al Islam</b><small>BS Computer Science · Semester 7</small><small style="margin-top:6px">ERP ID</small><b>${U.erp}</b><small style="margin-top:6px">Valid till</small><b>30 Jun 2027</b></div></div><div class=ctr style="border-top:1px dashed var(--b);padding:12px">${qrSvg('ID-'+U.erp)}<small>Scan at gates, library and exam halls</small></div></div>`;

const mTot=k=>MKS[k].reduce((a,r)=>a+r[2],0);
const curCourses=()=>`<div class=c><b class=ttl>Current courses</b><small style="margin:4px 0 6px">Marks synced with UMS</small>${Object.keys(CO).map(k=>`<div class="row sp li" style="cursor:default"><span style=flex:1><b>${CO[k][0]}</b><small>${CO[k][1]}</small></span><span class=bd>${mTot(k)}/100</span><button class=ib data-a=marks data-v=${k} aria-label="View marks for ${CO[k][0]}">${I('eye')}</button></div>`).join('')}</div>`;

const NOW=()=>dateISO(new Date());
const FLT=[['All','All'],['Today','Today'],['Upcoming','Upcoming'],['Due','Due'],['Week','Next 7 days'],['High','High priority']];
const taskList=()=>{const q=(S.taskQuery||'').trim().toLowerCase(),f=S.rf||'All',now=Date.now(),t=NOW();return [...REM].sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time)).filter(r=>{const dt=new Date(r.date+'T'+r.time+':00').getTime();if(q&&![r.title,r.type,r.date,r.time].join(' ').toLowerCase().includes(q))return 0;if(f=='Today'&&r.date!=t)return 0;if(f=='Upcoming'&&dt<=now)return 0;if(f=='Due'&&dt>now)return 0;if(f=='Week'&&!(dt>now&&dt<=now+7*864e5))return 0;if(f=='High'&&!r.hi)return 0;return 1})};
R();
