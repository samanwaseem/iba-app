csv:()=>{const c='task,seconds,taps,errors,result\n'+T.res.map(r=>r.join(',')).join('\n');try{navigator.clipboard.writeText(c);S.ts='CSV copied'}catch(e){S.ts='Copy failed'}},
sub:v=>{
if(v=='b1'){if(val({sid:['Enter your student ID'],bs:['Select a semester']}))A.go('b2')}
else if(v=='b4'){if(val({pk:['Select a pickup stop']}))ask('Sign up for Point '+S.rt+'?','Pickup: '+F.pk+' · '+F.bs+'.','Sign up',()=>{A.go('bok');done('bus')})}
else if(v=='addv'||v=='g1'){if(val({vn:['Enter the visitor’s full name'],cn:['Enter the CNIC',/^\d{5}-\d{7}-\d$/,'Use format 00000-0000000-0'],vp:['Enter a phone number',/^03\d{2} ?\d{7}$/,'Use format 03XX XXXXXXX']})){S.vs.push(F.vn);if(v=='addv'){['vn','cn','vp','pic'].forEach(k=>delete F[k]);S.ts='Visitor added. Add the next one.'}else A.go('g2')}}
else if(v=='g2'){if(val({vd:['Select a visit date'],vc:['Select a campus'],vr:['Describe the purpose of the visit']}))ask('Submit gate pass request?','This is a request, not an approved pass. '+S.vs.length+' visitor(s) on '+F.vd+'.','Submit',()=>{A.go('gok');done('gate')})}
else if(v=='cd1'){if(val({ty:['Choose a type'],og:['Enter the organization'],ro:['Enter your role'],st:['Pick a start date'],en:['Pick an end date'],d:['Attach your offer letter']})){if(F.en<F.st){E.en='End date must be after start date';return}const ed=S.edit;ask(ed?'Save your changes?':'Submit internship documents?',ed?'Your submission will be updated. You can edit again until '+fd(IN.find(x=>x.id==ed).dl)+'.':'CDC will review them. You can edit until '+fd(DL)+'.',ed?'Save changes':'Submit',()=>{if(ed){Object.assign(IN.find(x=>x.id==ed),{o:F.og,ty:F.ty,ro:F.ro,st:F.st,en:F.en,doc:F.d});S.edit=null;F={sem:F.sem,yr:F.yr};S.v=S.h.pop()||'ch';S.ts='Changes saved'}else{IN.unshift({id:''+(17025+IN.length),o:F.og,ty:F.ty,ro:F.ro,st:F.st,en:F.en,doc:F.d,dl:DL,s:'Pending',d:'23/10/26'});A.go('cdok')}})}}
else if(v=='cl1'){const r={pu:['Choose a purpose'],lo:['Enter the recipient'],pr:['Enter the program or opportunity'],by:['Pick a deadline'],dm:['Choose a delivery method']};if(F.dm=='Email to recipient')r.em=['Enter the recipient email',/^\S+@\S+\.\S+$/,'Enter a valid email address'];if(val(r))A.go('clr')}
else if(v=='clr')ask('Send request to CDC?','Letter for '+F.lo+', required by '+F.by+'.','Send request',()=>{LT.unshift({id:'RCL-26'+(43+LT.length),o:F.lo,p:F.pu,s:'Pending',d:'23/10/26'});A.go('clok');done('letter')})}
};
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&S.fid==1){A.fidx();R()}else if(e.key=='Escape'&&S.m){S.m=null;R()}});
document.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('mo')){S.m=null;R();return}if(T.cur&&e.target.closest('#app'))T.taps++;const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;A[a](v);if(a=='go'&&v=='adm')done('admit');R()});
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;let v=e.target.value;if(MK[k]){v=MK[k](v);if(e.target.value!==v)e.target.value=v}F[k]=v;delete E[k];e.target.closest('.f')?.classList.remove('bad')});
document.addEventListener('change',e=>{const k=e.target.dataset.k;if(k&&e.target.tagName=='SELECT'){F[k]=e.target.value;delete E[k];R()}});
R();
</script></body></html>
